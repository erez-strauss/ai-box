name: Feature request
description: Suggest a capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Some things are deliberately out of scope: a fourth distribution, MCP by
        default, a default egress filter inside the agent's container, and a Node
        toolchain for project work. See `docs/design-decisions.md` before proposing
        one of those, and say what changed.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: surface
    attributes:
      label: Does it widen the mount surface, add a capability, or add a network path?
      description: If yes, say why that is worth it. This is a security boundary first.
    validations:
      required: true
